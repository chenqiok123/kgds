<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡尼曼擂台 — KGDS 伴读测评</title>
<style>
:root{--bg:#060a14;--bg2:rgba(8,16,32,0.95);--bd:#1e3050;--acc:#5B9BD5;--acc2:rgba(91,155,213,0.15);--tx:#d4dce8;--tx2:#6a7a94;--gr:#4ECDC4;--ye:#FFD93D;--rd:#FF6B6B;--pu:#9B59B6;--go:#F0A500}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh}
#app{max-width:720px;margin:0 auto;padding:20px}

/* Header */
.header{text-align:center;padding:32px 0 24px;border-bottom:1px solid var(--bd);margin-bottom:24px}
.header h1{font-size:22px;font-weight:700;color:var(--acc);letter-spacing:2px;margin-bottom:6px}
.header .sub{font-size:12px;color:var(--tx2)}
.header .book-tag{display:inline-block;margin-top:8px;padding:4px 12px;background:rgba(155,89,182,0.2);color:var(--pu);border-radius:12px;font-size:11px;font-weight:600}

/* Anti-guess badge */
.anti-guess-badge{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:20px;padding:8px;background:rgba(255,217,61,0.1);border:1px solid rgba(255,217,61,0.3);border-radius:8px;font-size:11px;color:var(--ye)}
.anti-guess-badge .dot{width:6px;height:6px;background:var(--ye);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

/* Phase */
.phase{display:none}
.phase.active{display:block}

/* Question card */
.q-card{background:rgba(255,255,255,0.04);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px}
.q-meta{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.q-tag{font-size:10px;padding:3px 8px;border-radius:12px;font-weight:600}
.q-tag.knowledge{background:rgba(91,155,213,0.2);color:var(--acc)}
.q-tag.scenario{background:rgba(155,89,182,0.2);color:var(--pu)}
.q-tag.application{background:rgba(78,205,196,0.2);color:var(--gr)}
.q-tag.difficulty-1{background:rgba(78,205,196,0.15);color:var(--gr)}
.q-tag.difficulty-2{background:rgba(255,217,61,0.15);color:var(--ye)}
.q-tag.difficulty-3{background:rgba(255,107,107,0.15);color:var(--rd)}
.q-concept{font-size:11px;color:var(--tx2);margin-left:auto}
.q-text{font-size:15px;line-height:1.7;margin-bottom:16px}
.q-options{display:flex;flex-direction:column;gap:8px}
.q-opt{padding:12px 16px;border:1px solid var(--bd);border-radius:8px;cursor:pointer;font-size:13px;transition:all .2s;background:rgba(255,255,255,0.02);display:flex;align-items:center;gap:10px}
.q-opt:hover{border-color:var(--acc);background:rgba(91,155,213,0.08)}
.q-opt.chosen{border-color:var(--acc);background:var(--acc2);color:var(--acc)}
.q-opt .opt-letter{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.q-opt.chosen .opt-letter{background:var(--acc);color:#fff}

/* Nav */
.nav{display:flex;gap:12px;margin-top:20px;padding-bottom:40px}
.btn{padding:12px 28px;font-size:14px;border-radius:8px;cursor:pointer;border:none;font-weight:600;transition:all .2s;flex:1}
.btn-primary{background:var(--acc);color:#fff}
.btn-primary:hover{background:#6FB3E0}
.btn-secondary{background:var(--acc2);color:var(--acc);border:1px solid var(--bd)}
.btn:disabled{opacity:0.4;cursor:not-allowed}

/* Progress */
.progress-bar{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.progress-track{flex:1;height:6px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:var(--acc);border-radius:3px;transition:width .3s}
.progress-text{font-size:11px;color:var(--tx2);white-space:nowrap}

/* Report */
.report-header{text-align:center;margin-bottom:24px}
.report-score{font-size:48px;font-weight:700;color:var(--acc)}
.report-label{font-size:12px;color:var(--tx2);margin-top:4px}
.cross-validation{background:rgba(255,255,255,0.03);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:20px}
.cv-title{font-size:13px;font-weight:600;margin-bottom:12px;color:var(--ye)}
.cv-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.cv-item:last-child{border-bottom:none}
.cv-status{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.cv-status.pass{background:rgba(78,205,196,0.2);color:var(--gr)}
.cv-status.fail{background:rgba(255,107,107,0.2);color:var(--rd)}
.cv-status.decay{background:rgba(255,217,61,0.2);color:var(--ye)}
.cv-label{font-size:12px;flex:1}
.cv-detail{font-size:11px;color:var(--tx2)}
.concept-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:20px}
.concept-card{background:rgba(255,255,255,0.03);border:1px solid var(--bd);border-radius:10px;padding:14px}
.concept-name{font-size:13px;font-weight:600;margin-bottom:8px}
.concept-bar{height:6px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;margin-bottom:6px}
.concept-fill{height:100%;border-radius:3px;transition:width .3s}
.concept-fill.high{background:var(--gr)}
.concept-fill.mid{background:var(--ye)}
.concept-fill.low{background:var(--rd)}
.concept-stats{font-size:11px;color:var(--tx2);display:flex;justify-content:space-between}
.concept-cross{font-size:10px;margin-top:6px;padding:2px 6px;border-radius:4px;display:inline-block}
.concept-cross.ok{background:rgba(78,205,196,0.15);color:var(--gr)}
.concept-cross.decay{background:rgba(255,217,61,0.15);color:var(--ye)}
.explanation{background:rgba(91,155,213,0.08);border-left:3px solid var(--acc);padding:12px 14px;margin-top:16px;border-radius:0 8px 8px 0;font-size:12px;line-height:1.6}
.explanation-title{font-size:11px;font-weight:600;color:var(--acc);margin-bottom:6px}
.result-actions{display:flex;gap:12px;margin-top:20px}
.back-link{text-align:center;margin-top:24px}
.back-link a{color:var(--acc);text-decoration:none;font-size:12px}
.back-link a:hover{text-decoration:underline}

/* Start screen */
.start-screen{text-align:center;padding:40px 20px}
.start-icon{font-size:48px;margin-bottom:16px}
.start-title{font-size:20px;font-weight:600;margin-bottom:8px}
.start-desc{font-size:13px;color:var(--tx2);line-height:1.7;margin-bottom:24px;max-width:400px;margin-left:auto;margin-right:auto}
.start-features{display:flex;justify-content:center;gap:20px;margin-bottom:28px;flex-wrap:wrap}
.start-feature{text-align:center;font-size:11px;color:var(--tx2)}
.start-feature .icon{font-size:20px;margin-bottom:4px}

@media(max-width:640px){
  #app{padding:12px}
  .header h1{font-size:18px}
  .q-card{padding:14px}
  .concept-grid{grid-template-columns:1fr}
  .nav{flex-direction:column}
}
</style>
</head>
<body>
<div id="app">

  <!-- 返回首页 -->
  <a href="/" style="position:fixed;top:16px;left:16px;z-index:100;display:flex;align-items:center;gap:6px;padding:8px 14px;background:rgba(255,255,255,0.08);border:1px solid var(--bd);border-radius:8px;color:var(--tx);text-decoration:none;font-size:12px;transition:all .2s" onmouseover="this.style.background='rgba(255,255,255,0.15)'" onmouseout="this.style.background='rgba(255,255,255,0.08)'">
    <span style="font-size:14px">←</span> 返回首页
  </a>

  <!-- Start Phase -->
  <div class="phase active" id="phase-start">
    <div class="start-screen">
      <div class="start-icon">⚔️</div>
      <h1 class="start-title">卡尼曼擂台</h1>
      <div class="book-tag">《思考，快与慢》</div>
      <p class="start-desc">
        12道反盲选测试题，覆盖伴读20期核心概念。<br>
        交叉验证机制确保：真理解才能全对，背答案无法蒙混。
      </p>
      <div class="start-features">
        <div class="start-feature"><div class="icon">🔗</div>交叉验证</div>
        <div class="start-feature"><div class="icon">📉</div>置信度衰减</div>
        <div class="start-feature"><div class="icon">🎯</div>概念映射</div>
      </div>
      <button class="btn btn-primary" onclick="startArena()" style="width:200px">开始挑战</button>
    </div>
    <div class="back-link"><a href="/">← 返回KGDS主页</a></div>
  </div>

  <!-- Test Phase -->
  <div class="phase" id="phase-test">
    <div class="anti-guess-badge">
      <span class="dot"></span>
      反盲选机制已激活 · 交叉验证中
    </div>
    <div class="progress-bar">
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <span class="progress-text" id="progress-text">0/12</span>
    </div>
    <div id="questions-container"></div>
    <div class="nav">
      <button class="btn btn-secondary" onclick="prevQuestion()" id="btn-prev">← 上一题</button>
      <button class="btn btn-primary" onclick="nextQuestion()" id="btn-next">下一题 →</button>
      <button class="btn btn-primary" onclick="submitArena()" id="btn-submit" style="display:none">提交测评</button>
    </div>
  </div>

  <!-- Report Phase -->
  <div class="phase" id="phase-report">
    <div class="report-header">
      <div class="report-score" id="report-score">--</div>
      <div class="report-label">总正确率</div>
    </div>

    <div class="cross-validation" id="cross-validation-section">
      <div class="cv-title">🔗 交叉验证结果</div>
      <div id="cv-items"></div>
    </div>

    <div class="concept-grid" id="concept-grid"></div>

    <div id="explanations"></div>

    <div class="result-actions">
      <button class="btn btn-secondary" onclick="restartArena()">重新测试</button>
      <button class="btn btn-primary" onclick="location.href='/'">返回KGDS</button>
    </div>
  </div>

</div>

<script>
let arenaData = null;
let currentIndex = 0;
let answers = {};

async function loadArena() {
  try {
    const res = await fetch('/api/arena/tests');
    arenaData = await res.json();
    renderQuestion(0);
  } catch(e) {
    alert('加载题库失败: ' + e.message);
  }
}

function startArena() {
  document.getElementById('phase-start').classList.remove('active');
  document.getElementById('phase-test').classList.add('active');
  loadArena();
}

function renderQuestion(idx) {
  const t = arenaData.tests[idx];
  currentIndex = idx;
  const container = document.getElementById('questions-container');

  let typeClass = t.type;
  let typeLabel = t.type === 'knowledge' ? '概念' : t.type === 'scenario' ? '场景' : '应用';
  let diffLabel = t.difficulty === 1 ? '基础' : t.difficulty === 2 ? '进阶' : '高阶';
  let diffClass = 'difficulty-' + t.difficulty;

  container.innerHTML = `
    <div class="q-card">
      <div class="q-meta">
        <span class="q-tag ${typeClass}">${typeLabel}</span>
        <span class="q-tag ${diffClass}">${diffLabel}</span>
        <span class="q-concept">${t.concept}</span>
      </div>
      <div class="q-text">${t.question}</div>
      <div class="q-options">
        ${t.options.map((opt, i) => `
          <div class="q-opt ${answers[t.id] === i ? 'chosen' : ''}" onclick="selectOption('${t.id}', ${i})">
            <span class="opt-letter">${String.fromCharCode(65+i)}</span>
            <span>${opt}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;

  document.getElementById('progress-fill').style.width = ((idx + 1) / arenaData.tests.length * 100) + '%';
  document.getElementById('progress-text').textContent = `${idx + 1}/${arenaData.tests.length}`;

  document.getElementById('btn-prev').disabled = idx === 0;
  document.getElementById('btn-next').style.display = idx === arenaData.tests.length - 1 ? 'none' : 'block';
  document.getElementById('btn-submit').style.display = idx === arenaData.tests.length - 1 ? 'block' : 'none';
}

function selectOption(qid, idx) {
  answers[qid] = idx;
  renderQuestion(currentIndex);
}

function prevQuestion() {
  if (currentIndex > 0) renderQuestion(currentIndex - 1);
}

function nextQuestion() {
  if (currentIndex < arenaData.tests.length - 1) renderQuestion(currentIndex + 1);
}

async function submitArena() {
  const questions = arenaData.tests.map(t => ({
    id: t.id,
    correct: t.correct,
    concept: t.concept,
    difficulty: t.difficulty,
    type: t.type
  }));

  try {
    const res = await fetch('/api/arena/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ answers, questions, token: localStorage.getItem('kgds_token') })
    });
    const report = await res.json();
    showReport(report);
  } catch(e) {
    alert('提交失败: ' + e.message);
  }
}

function showReport(report) {
  document.getElementById('phase-test').classList.remove('active');
  document.getElementById('phase-report').classList.add('active');

  document.getElementById('report-score').textContent = report.total_score + '%';

  // Cross validation
  const cvContainer = document.getElementById('cv-items');
  let cvHtml = '';
  for (const [pair, result] of Object.entries(report.pair_results)) {
    let status, statusClass, statusText;
    if (result.both_correct) {
      status = '✓'; statusClass = 'pass'; statusText = '交叉验证通过';
    } else if (result.one_correct) {
      status = '⚠'; statusClass = 'decay'; statusText = '置信度衰减50%';
    } else {
      status = '✗'; statusClass = 'fail'; statusText = '需重新学习';
    }
    cvHtml += `
      <div class="cv-item">
        <span class="cv-status ${statusClass}">${status}</span>
        <span class="cv-label">${pair}</span>
        <span class="cv-detail">${statusText}</span>
      </div>
    `;
  }
  cvContainer.innerHTML = cvHtml;

  // Concept grid
  const grid = document.getElementById('concept-grid');
  let gridHtml = '';
  for (const [concept, score] of Object.entries(report.concept_scores)) {
    const pct = Math.round(score.mastery * 100);
    const fillClass = pct >= 80 ? 'high' : pct >= 50 ? 'mid' : 'low';
    const crossHtml = score.cross_validated === true
      ? '<span class="concept-cross ok">交叉验证 ✓</span>'
      : score.cross_validated === false
        ? '<span class="concept-cross decay">置信度衰减</span>'
        : '';
    gridHtml += `
      <div class="concept-card">
        <div class="concept-name">${concept}</div>
        <div class="concept-bar"><div class="concept-fill ${fillClass}" style="width:${pct}%"></div></div>
        <div class="concept-stats">
          <span>${score.correct}/${score.total}</span>
          <span>${pct}%</span>
        </div>
        ${crossHtml}
      </div>
    `;
  }
  grid.innerHTML = gridHtml;

  // Explanations
  const expContainer = document.getElementById('explanations');
  let expHtml = '';
  for (const t of arenaData.tests) {
    const chosen = answers[t.id];
    const isCorrect = chosen === t.correct;
    if (!isCorrect) {
      expHtml += `
        <div class="explanation">
          <div class="explanation-title">${t.id} · ${t.concept} · 正确答案: ${String.fromCharCode(65 + t.correct)}</div>
          ${t.explanation}
        </div>
      `;
    }
  }
  expContainer.innerHTML = expHtml || '<div style="text-align:center;color:var(--gr);padding:20px">全部答对，无需解析 🎉</div>';
}

function restartArena() {
  answers = {};
  currentIndex = 0;
  document.getElementById('phase-report').classList.remove('active');
  document.getElementById('phase-start').classList.add('active');
}
</script>
</body>
</html>
