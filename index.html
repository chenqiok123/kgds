<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a1a">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/apps/kgds/icon-192.png">
<title>第二大脑 · KGDS</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a1a; color:#e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .container { text-align:center; padding:2rem; }
  h1 { font-size:2.5rem; margin-bottom:0.5rem; background:linear-gradient(135deg,#5B9BD5,#9b59b6); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .subtitle { color:#888; margin-bottom:3rem; }
  .apps { display:flex; flex-wrap:wrap; gap:1.5rem; justify-content:center; }
  .app-card {
    background:linear-gradient(135deg, #1a1a2e, #16213e);
    border:1px solid #2a2a4a;
    border-radius:16px;
    padding:2rem 2.5rem;
    width:280px;
    text-align:left;
    transition: all 0.3s;
    cursor:pointer;
    text-decoration:none;
    color:inherit;
    display:block;
  }
  .app-card:hover { border-color:#5B9BD5; transform:translateY(-4px); box-shadow:0 12px 40px rgba(91,155,213,0.2); }
  .app-card .icon { font-size:2rem; margin-bottom:1rem; }
  .app-card h3 { font-size:1.3rem; margin-bottom:0.5rem; }
  .app-card p { color:#888; font-size:0.9rem; margin-bottom:0.75rem; }
  .app-card .tag { display:inline-block; background:rgba(91,155,213,0.2); color:#5B9BD5; padding:2px 10px; border-radius:20px; font-size:0.75rem; }
  .version { color:#666; margin-top:3rem; font-size:0.8rem; }
  .admin-link { margin-top:1.5rem; }
  .admin-link a { color:#666; font-size:0.85rem; text-decoration:none; }
  .admin-link a:hover { color:#5B9BD5; }
</style>
</head>
<body>
<div class="container">
  <h1>第二大脑 · V2.0</h1>
  <p class="subtitle">通用认知底座平台</p>

  <div class="apps">
    <a href="/apps/kgds/app.html" class="app-card">
      <div class="icon">🧠</div>
      <h3>KGDS</h3>
      <p>知识图谱诊断系统 — 职业测评 × 3D知识图谱 × 自适应学习</p>
      <span class="tag">v2.0.0</span>
    </a>

    <a href="/apps/topoo/topoo.html" class="app-card">
      <div class="icon">📖</div>
      <h3>兔扑 H5</h3>
      <p>AI伴读 × 打分擂台 × 知识图谱 — 思考快与慢</p>
      <span class="tag">v1.4.0</span>
    </a>
  </div>

  <div class="admin-link">
    <a href="/apps/kgds/admin.html">⚙ 管理后台</a>
  </div>

  <div class="version">第二大脑 V2.0 · PWA Ready</div>
</div>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>
</body>
</html>
